<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!--
        The browser UI colour, matching the ink the shell chrome is painted in:
        `--topbar-bg`, light scheme (the same token and the same value the
        player app's index.html carries, because both apps' chrome is the same
        bar). This literal is the pre-boot value only — `manage/theme-color.ts`
        rewrites it from the resolved token map as soon as the theme is known,
        including the dark-scheme ink and a stored preference that disagrees
        with the system.
    -->
    <meta name="theme-color" content="#1e3526">
    <title>Tapscore Manage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }

        /*
         * Same page frame as the player app's index.html — the two clients
         * share a brand, so they share the typeface, the tabular numerals a
         * catalog of pars and lengths needs, and the token-driven page fill.
         * `var(--bg)` / `var(--text)` are declared by `manage/theme.ts` at
         * import time; until then the page is unpainted rather than white,
         * which is the same pre-boot behaviour the player app has.
         */
        body {
            font-family: 'Archivo', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            font-variant-numeric: tabular-nums;
        }

        #app { height: 100%; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
